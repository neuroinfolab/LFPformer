backbone: wav2vec2
pretrained_model: facebook/wav2vec2-base
rand_init: false
hidden_size: 768
num_hidden_layers: 12
num_attention_heads: 12
intermediate_size: 3072
mask_time_prob: 0.079
mask_time_length: 5
num_negatives: 100
cross_sample_negatives: true
lr_ssl: 0.000102
weight_decay: 0.08
warmup_steps: 400
warmup_start_factor: 0.01
batch_size_ssl: 64
ssl_epochs: 200
grad_clip_norm: 1.0
eta_min: 1.0e-05
lr_schedule: plateau
plateau_factor: 0.5
plateau_patience: 5
hidden_dropout: 0.097
attention_dropout: 0.042
final_dropout: 0.0
gumbel_temp_init: 2.0
gumbel_temp_min: 0.5
gumbel_temp_decay: 0.999995
xyz_lambda: 0.0
dist_lambda: 0.0
distpred_lambda: 0.0
atlas_depth: 5
amp: false
num_workers: 8
prefetch_factor: 16
detailed_logging: true
embed_interval: 5
probe_interval: 5
probe_epochs: 20
max_probe_samples: 0
early_stop_patience: 30
