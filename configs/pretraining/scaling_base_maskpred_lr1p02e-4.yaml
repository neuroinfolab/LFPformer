backbone: wav2vec2
pretrained_model: facebook/wav2vec2-base
rand_init: false
hidden_size: 768
num_hidden_layers: 12
num_attention_heads: 12
intermediate_size: 3072
mask_time_prob: 0.079
mask_time_length: 5
num_negatives: 100
cross_sample_negatives: true
weight_decay: 0.08
warmup_steps: 1200
warmup_start_factor: 0.001
grad_clip_norm: 1.0
eta_min: 1.0e-06
lr_schedule: cosine
hidden_dropout: 0.097
attention_dropout: 0.042
final_dropout: 0.0
gumbel_temp_init: 2.0
gumbel_temp_min: 0.5
gumbel_temp_decay: 0.999995
xyz_lambda: 0.0
dist_lambda: 0.0
dist_target_fraction: 0.0
distpred_lambda: 0.0
channel_distance: false
dist_sigma: 500.0
dist_temperature: 0.2
atlas_depth: 5
amp: false
detailed_logging: true
step_mode: true
batch_size_ssl: 512
ssl_epochs: 3
lr_ssl: 0.000102
num_workers: 4
prefetch_factor: 8
log_every_steps: 50
val_every_steps: 1000
ckpt_every_steps: 2000
snapshot_every_samples: 2560000
probe_every_steps: 5000
probe_epochs: 20
embed_interval: 0
probe_interval: 0
max_probe_samples: 0
early_stop_patience: 0
max_global_step: 120000
