[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lfpformer"
version = "0.1.0"
description = "LFPformer: LFP representation learning and anatomical localization"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.10", "PyYAML>=6"]

[project.optional-dependencies]
train = ["torch>=2.2", "torchaudio>=2.2", "transformers>=4.40,<5", "scikit-learn>=1.3", "pandas>=1.5", "tqdm>=4.64", "matplotlib>=3.7", "datasets>=2", "accelerate>=0.26", "h5py>=3", "pynrrd", "librosa>=0.10"]
ibl = ["ONE-api", "ibllib", "iblatlas", "ibl-neuropixel"]
allen = ["pynwb", "pandas", "h5py", "allensdk"]
neuronexus = ["h5py", "pandas", "lxml", "spikeinterface", "librosa>=0.10", "pynrrd"]
dev = ["pytest>=7", "build"]

[project.scripts]
lfpformer = "lfpformer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lfpformer*"]
namespaces = true

[tool.setuptools.package-data]
lfpformer = ["_reference/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
